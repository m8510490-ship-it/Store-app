<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Store ERP Inventory</title>
    <!-- Barcode Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; padding: 0; background-color: #f4f6f9; color: #333; }
        header { background: #1e3c72; color: white; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; }
        .nav-tabs { display: flex; background: white; border-bottom: 2px solid #ddd; position: sticky; top: 0; z-index: 10; }
        .tab-btn { flex: 1; padding: 12px 5px; border: none; background: none; font-size: 0.9rem; font-weight: bold; cursor: pointer; color: #666; }
        .tab-btn.active { color: #1e3c72; border-bottom: 3px solid #1e3c72; }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .btn-primary { background: #1e3c72; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-scan { background: #ff9800; color: white; margin-bottom: 10px; }
        .stock-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; }
        .badge-alert { background: #ffdddd; color: #d32f2f; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        #reader { width: 100%; border-radius: 8px; margin-bottom: 10px; }
    </style>
</head>
<body>

<header>📦 સ્ટોર અને ઇન્વેન્ટરી ERP</header>

<div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('stock')">📊 સ્ટોક</button>
    <button class="tab-btn" onclick="switchTab('inward')">📥 ઇનવર્ડ</button>
    <button class="tab-btn" onclick="switchTab('outward')">📤 આઉટવર્ડ</button>
    <button class="tab-btn" onclick="switchTab('master')">➕ માસ્ટર</button>
</div>

<div class="container">

    <!-- ૧. સ્ટોક લિસ્ટ -->
    <div id="tab-stock" class="tab-content active">
        <div class="card">
            <h3>લાઇવ સ્ટોક બેલેન્સ</h3>
            <div id="stock-list">હાલમાં કોઈ સ્ટોક નથી.</div>
        </div>
    </div>

    <!-- ૨. ઇનવર્ડ / Stock In -->
    <div id="tab-inward" class="tab-content">
        <div class="card">
            <h3>મટિરિયલ ઇનવર્ડ (Stock In)</h3>
            <button class="btn btn-scan" onclick="startScanner('inward-code')">📷 કેમેરાથી કોડ સ્કેન કરો</button>
            <div id="reader-inward" style="display:none;"></div>
            
            <div class="form-group">
                <label>આઈટમ કોડ:</label>
                <input type="text" id="inward-code" placeholder="કોડ દાખલ કરો અથવા સ્કેન કરો">
            </div>
            <div class="form-group">
                <label>જથ્થો (Qty):</label>
                <input type="number" id="inward-qty" placeholder="દા.ત. 10">
            </div>
            <div class="form-group">
                <label>સપ્લાયર / ચલણ નં.:</label>
                <input type="text" id="inward-ref" placeholder="Supplier / Challan Details">
            </div>
            <button class="btn btn-success" onclick="processStock('IN')">સ્ટોકમાં ઉમેરો (Inward)</button>
        </div>
    </div>

    <!-- ૩. આઉટવર્ડ / Issue -->
    <div id="tab-outward" class="tab-content">
        <div class="card">
            <h3>મટિરિયલ ઇશ્યૂ (Stock Out)</h3>
            <button class="btn btn-scan" onclick="startScanner('outward-code')">📷 કેમેરાથી કોડ સ્કેન કરો</button>
            <div id="reader-outward" style="display:none;"></div>

            <div class="form-group">
                <label>આઈટમ કોડ:</label>
                <input type="text" id="outward-code" placeholder="કોડ દાખલ કરો અથવા સ્કેન કરો">
            </div>
            <div class="form-group">
                <label>જથ્થો (Qty):</label>
                <input type="number" id="outward-qty" placeholder="દા.ત. 5">
            </div>
            <div class="form-group">
                <label>વિભાગ / લેનાર વ્યક્તિ:</label>
                <input type="text" id="outward-ref" placeholder="Dept / Receiver Name">
            </div>
            <button class="btn btn-danger" onclick="processStock('OUT')">મટિરિયલ ઇશ્યૂ કરો (Outward)</button>
        </div>
    </div>

    <!-- ૪. નવું આઈટમ માસ્ટર -->
    <div id="tab-master" class="tab-content">
        <div class="card">
            <h3>નવી આઈટમ ઉમેરો</h3>
            <button class="btn btn-scan" onclick="startScanner('master-code')">📷 કેમેરાથી બારકોડ સ્કેન કરો</button>
            <div id="reader-master" style="display:none;"></div>

            <div class="form-group">
                <label>આઈટમ કોડ / બારકોડ:</label>
                <input type="text" id="master-code" placeholder="દા.ત. ITM-001">
            </div>
            <div class="form-group">
                <label>આઈટમનું નામ:</label>
                <input type="text" id="master-name" placeholder="દા.ત. Bolt 10mm">
            </div>
            <div class="form-group">
                <label>યુનિટ (UOM):</label>
                <select id="master-uom">
                    <option value="NOS">NOS</option>
                    <option value="KG">KG</option>
                    <option value="MTR">MTR</option>
                    <option value="BOX">BOX</option>
                </select>
            </div>
            <div class="form-group">
                <label>મિનિમમ સ્ટોક એલર્ટ લિમિટ:</label>
                <input type="number" id="master-min" value="5">
            </div>
            <button class="btn btn-primary" onclick="saveMaster()">માસ્ટર સેવ કરો</button>
        </div>
    </div>

</div>

<script>
    // LocalStorage માંથી ડેટા લોડ કરવો
    let inventory = JSON.parse(localStorage.getItem('erp_inventory')) || [];
    let html5QrCode = null;

    function saveToStorage() {
        localStorage.setItem('erp_inventory', JSON.stringify(inventory));
        renderStock();
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(`tab-${tab}`).classList.add('active');
        event.target.classList.add('active');
        if (html5QrCode) {
            html5QrCode.stop().catch(() => {});
        }
    }

    function renderStock() {
        const listDiv = document.getElementById('stock-list');
        if (inventory.length === 0) {
            listDiv.innerHTML = '<p style="color:#777;">હજુ કોઈ આઈટમ ઉમેરાઈ નથી.</p>';
            return;
        }

        let html = '';
        inventory.forEach(item => {
            const isLow = item.stock <= item.minStock;
            html += `
                <div class="stock-item">
                    <div>
                        <strong>${item.name}</strong> (${item.code})<br>
                        <small style="color:#666;">મિનિમમ: ${item.minStock} ${item.uom}</small>
                        ${isLow ? '<span class="badge-alert">Low Stock</span>' : ''}
                    </div>
                    <div style="font-size: 1.1rem; font-weight: bold; color: ${isLow ? '#d32f2f' : '#2e7d32'};">
                        ${item.stock} ${item.uom}
                    </div>
                </div>
            `;
        });
        listDiv.innerHTML = html;
    }

    function saveMaster() {
        const code = document.getElementById('master-code').value.trim();
        const name = document.getElementById('master-name').value.trim();
        const uom = document.getElementById('master-uom').value;
        const minStock = parseFloat(document.getElementById('master-min').value) || 0;

        if (!code || !name) {
            alert('કૃપા કરીને આઈટમ કોડ અને નામ દાખલ કરો.');
            return;
        }

        const exists = inventory.find(i => i.code.toLowerCase() === code.toLowerCase());
        if (exists) {
            alert('આ કોડ પહેલેથી હાજર છે!');
            return;
        }

        inventory.push({ code, name, uom, minStock, stock: 0 });
        saveToStorage();
        alert('આઈટમ સફળતાપૂર્વક ઉમેરાઈ ગઈ!');
        document.getElementById('master-code').value = '';
        document.getElementById('master-name').value = '';
    }

    function processStock(type) {
        const codeId = type === 'IN' ? 'inward-code' : 'outward-code';
        const qtyId = type === 'IN' ? 'inward-qty' : 'outward-qty';

        const code = document.getElementById(codeId).value.trim();
        const qty = parseFloat(document.getElementById(qtyId).value);

        if (!code || isNaN(qty) || qty <= 0) {
            alert('સાચો કોડ અને જથ્થો દાખલ કરો.');
            return;
        }

        const item = inventory.find(i => i.code.toLowerCase() === code.toLowerCase());
        if (!item) {
            alert('આઈટમ મળી નથી! પહેલા માસ્ટરમાં એન્ટ્રી કરો.');
            return;
        }

        if (type === 'OUT' && item.stock < qty) {
            alert(`પૂરતો સ્ટોક નથી! ઉપલબ્ધ સ્ટોક: ${item.stock}`);
            return;
        }

        if (type === 'IN') {
            item.stock += qty;
            alert(`ઇનવર્ડ સફળ! નવો સ્ટોક: ${item.stock}`);
        } else {
            item.stock -= qty;
            alert(`આઉટવર્ડ સફળ! બાકી સ્ટોક: ${item.stock}`);
        }

        saveToStorage();
        document.getElementById(qtyId).value = '';
    }

    function startScanner(targetInputId) {
        const readerId = targetInputId.includes('inward') ? 'reader-inward' : 
                         targetInputId.includes('outward') ? 'reader-outward' : 'reader-master';
        
        const readerDiv = document.getElementById(readerId);
        readerDiv.style.display = 'block';

        html5QrCode = new Html5Qrcode(readerId);
        html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            (decodedText) => {
                document.getElementById(targetInputId).value = decodedText;
                html5QrCode.stop().then(() => {
                    readerDiv.style.display = 'none';
                });
            },
            (error) => {}
        ).catch(err => {
            alert("કેમેરા એક્સેસ ભૂલ: " + err);
            readerDiv.style.display = 'none';
        });
    }

    renderStock();
</script>

</body>
</html>
